appId: com.clinify.app
---
- launchApp
- tapOn:
    text: "Email"
- inputText: "admin@clinic.com"
- tapOn:
    text: "Password"
- inputText: "password123"
- tapOn:
    text: "Sign In"
- extendedWaitUntil:
    visible: "Admin Dashboard"
    timeout: 15000
- tapOn: "Doctors"
- extendedWaitUntil:
    visible: "Dr. Mona Farid"
    timeout: 10000
- tapOn: "Dr. Mona Farid"
- extendedWaitUntil:
    visible: "Deactivate Doctor"
    timeout: 10000
- tapOn: "Deactivate Doctor"
- tapOn: "Deactivate"
- extendedWaitUntil:
    visible: "Doctors"
    timeout: 10000
- tapOn:
    id: "admin-doctors-show-inactive"
- extendedWaitUntil:
    visible: "Dr. Mona Farid"
    timeout: 10000
- tapOn: "Dr. Mona Farid"
- extendedWaitUntil:
    visible: "Reactivate Doctor"
    timeout: 10000
- tapOn:
    id: "admin-reactivate-doctor"
- extendedWaitUntil:
    visible: "Edit Doctor"
    timeout: 10000
