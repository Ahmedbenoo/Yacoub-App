appId: com.clinify.app
---
- launchApp
- tapOn:
    text: "Email"
- inputText: "doctor@clinic.com"
- tapOn:
    text: "Password"
- inputText: "password123"
- tapOn:
    text: "Sign In"
- extendedWaitUntil:
    visible: "Doctor Dashboard"
    timeout: 15000
- tapOn: "Appointments"
- extendedWaitUntil:
    visible: "All"
    timeout: 10000
- tapOn: "Scheduled"
