appId: com.clinify.app
---
- launchApp
- tapOn:
    text: "Email"
- inputText: "admin@clinic.com"
- tapOn:
    text: "Password"
- inputText: "password123"
- tapOn:
    text: "Sign In"
- extendedWaitUntil:
    visible: "Admin Dashboard"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "View all"
    direction: DOWN
    timeout: 10000
- tapOn: "View all"
- extendedWaitUntil:
    visible: "All Reports"
    timeout: 10000
- assertVisible: "Monthly Appointments Summary"
