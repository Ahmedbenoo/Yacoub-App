appId: com.clinify.app
---
- launchApp
- tapOn:
    text: "Email"
- inputText: "patient@clinic.com"
- tapOn:
    text: "Password"
- inputText: "password123"
- tapOn: "Sign In"
- assertVisible: "Patient Home"
- tapOn: "Records"
- assertVisible: "Medical Records"
- tapOn: "General checkup"
- assertVisible: "Visit Summary"
- tapOn:
    text: "Back"
- tapOn: "Amlodipine 5mg"
- assertVisible: "Prescription"
