appId: com.clinify.app
---
- launchApp
- tapOn:
    text: "Email"
- inputText: "patient@clinic.com"
- tapOn:
    text: "Password"
- inputText: "password123"
- tapOn:
    text: "Sign In"
- extendedWaitUntil:
    visible: "Home"
    timeout: 15000
- tapOn: "Search"
- tapOn: "Doctors"
- extendedWaitUntil:
    visible: "Dr. Mona Farid"
    timeout: 10000
- tapOn: "Dr. Mona Farid"
- extendedWaitUntil:
    visible: "Book appointment"
    timeout: 10000
- tapOn:
    id: "patient-book-appointment"
- extendedWaitUntil:
    visible: "Select a time slot"
    timeout: 10000
- tapOn:
    id: "booking-slot-0"
- tapOn: "Reason for visit"
- inputText: "Skin checkup"
- tapOn:
    id: "booking-submit"
- extendedWaitUntil:
    visible: "Appointments"
    timeout: 15000
