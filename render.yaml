databases:
  - name: yacoub-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "16"

services:
  - type: web
    name: yacoub-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/v1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: yacoub-db
          property: connectionString
      - key: SEED_DEMO
        value: "false"
      - key: JWT_SECRET
        generateValue: true
